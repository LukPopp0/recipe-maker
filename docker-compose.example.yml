# Example deployment: the app plus tinyauth, both bound to localhost and put
# behind a reverse proxy (see docs/self-hosting.md for the nginx config).
services:
  recipes:
    image: ghcr.io/OWNER/recipe-maker:latest
    restart: unless-stopped
    # Reaps orphaned Chromium processes from the URL browser fallback.
    init: true
    # Lets an in-flight ingest (browser fetch plus Gemini) finish on stop.
    stop_grace_period: 45s
    # Only the app's settings, so tinyauth's user hashes in .env never reach
    # this container. Add other server settings (docs/specs/11) here.
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      AUTH_MODE: ${AUTH_MODE:-header}
      ADMIN_USERS: ${ADMIN_USERS}
    ports:
      - "127.0.0.1:8787:8787"
    # Host dirs must exist and be writable by uid 1001: mkdir -p data/db data/images && sudo chown -R 1001:1001 data
    volumes:
      - ./data/db:/app/data/db
      - ./data/images:/app/data/images

  tinyauth:
    # Pin a release tag from https://github.com/tinyauthapp/tinyauth/releases
    image: ghcr.io/tinyauthapp/tinyauth:vX.Y.Z
    restart: unless-stopped
    environment:
      TINYAUTH_APPURL: ${TINYAUTH_APPURL}
      TINYAUTH_AUTH_USERS: ${TINYAUTH_AUTH_USERS}
      TINYAUTH_AUTH_SECURECOOKIE: ${TINYAUTH_AUTH_SECURECOOKIE}
    ports:
      - "127.0.0.1:3000:3000"
