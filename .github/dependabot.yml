# Keeps the SHA-pinned actions in .github/workflows current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One PR for all action updates, so a batch costs one image build
    # (each merge to main publishes a new GHCR version).
    groups:
      github-actions:
        patterns:
          - "*"
