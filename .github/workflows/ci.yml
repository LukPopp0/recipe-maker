name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; the image job asks for packages: write itself.
permissions:
  contents: read

# Actions are pinned to commit SHAs (the image job's token can push the
# published image); Dependabot keeps the pins current.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

  # Decides whether a push to main needs a new image. Docs-only and
  # extension-only pushes (the image never contains extension/) skip
  # the build, so they do not publish a GHCR version and push an older one
  # out of the 10 kept. Filtered here, not with on.push.paths, so the test
  # job (a PR check) always runs.
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA"); then
            echo "Cannot diff $BEFORE..$GITHUB_SHA; building to be safe."
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          # Any file outside this list (unknown ones too) means a build.
          if printf '%s\n' "$files" | grep -qvE '^(docs/|extension/|[^/]+\.md$|LICENSE$|\.github/dependabot\.yml$)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs/extension files changed; skipping the image build."
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: [test, changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # One publish at a time, so :latest and the prune below run in order.
    concurrency:
      group: image-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/recipe-maker
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # Build once into the local daemon, smoke-test that image, then push
      # exactly it (no second build that could differ on a cache miss).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: |
            recipe-maker:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # one push = one GHCR version, so the prune keeps 10 pullable images
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: scripts/docker-smoke-test.sh recipe-maker:ci

      - name: Push the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker push "$tag"
          done

      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: recipe-maker
          package-type: container
          min-versions-to-keep: 10
